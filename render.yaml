# Render Blueprint: one Docker web service (API + frontend) and one Postgres database.
# Render dashboard > New > Blueprint > pick this repo.
databases:
  - name: digilocker-db
    databaseName: digilocker_fraud
    user: digilocker
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []   # private: only the web service can reach it

services:
  - type: web
    name: digilocker-fraud
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: digilocker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO_USERS
        value: "true"
      - key: DEMO_SHOW_OTP        # shows the OTP on screen (no SMS in this demo). Remove for anything real.
        value: "true"
