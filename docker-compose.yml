# One command to run everything locally:  docker compose up --build
# Then open http://localhost:5001  (dashboard: http://localhost:5001/#/dashboard)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: digilocker_fraud
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d digilocker_fraud"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "5001:5001"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/digilocker_fraud
      JWT_SECRET: change-me-for-anything-beyond-a-local-demo
      PORT: "5001"
      SEED_DEMO_USERS: "true"
      DEMO_SHOW_OTP: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
